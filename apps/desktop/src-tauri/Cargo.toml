[package]
name = "fsodefender"
version = "0.1.0"
description = "FSODefender — modern Windows antivirus"
authors = ["FSODefender"]
edition = "2024"

[lib]
name = "fsodefender_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fsod-core = { path = "../../../crates/fsod-core" }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tauri uygulaması kendi Cargo workspace'idir; kök workspace'e dahil değildir.
[workspace]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
